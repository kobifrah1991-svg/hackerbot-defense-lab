<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="מעבדת הגנה של HackerBot — אימון אבטחת מידע הגנתי אינטראקטיבי בעברית">
  <title>HackerBot Defense Lab · מעבדת הגנה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/thm.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <div class="bg-layers" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>
    <div class="bg-orb o3"></div>
    
  </div>

  <div id="app" class="thm">
    <aside class="sidebar">
      <a href="#/" class="logo" id="logoBtn"><div class="logo-icon">🛡️</div><div class="logo-text">HackerBot<span>מעבדת הגנה</span></div></a>
      <nav class="side-nav">
        <a href="#/" data-nav="home">🏠 לוח בקרה</a>
        <a href="#/paths" data-nav="paths">🧭 מסלולים</a>
        <a href="#/rooms" data-nav="rooms">🚪 חדרים</a>
        <a href="#/profile" data-nav="profile">👤 פרופיל</a>
      </nav>
      <div class="side-rank"><div class="rank-ring" id="rankRing"><span id="hdrLevel">1</span></div>
        <div><div class="rank-title" id="rankTitle">מגן מתחיל</div><div class="rank-xp"><span id="hdrXp">0</span> XP</div>
        <div class="xp-bar-wrap"><div class="xp-bar-fill" id="hdrXpBar"></div></div></div></div>
      <div class="lang-switch"><button onclick="setLang('he')">עב</button><button onclick="setLang('en')">EN</button></div>
      <div id="authBox" class="auth-box"></div>
    </aside>
    <div class="main-col">
      <main class="view" id="view-home"></main>
      <main class="view" id="view-paths"></main>
      <main class="view" id="view-rooms"></main>
      <main class="view" id="view-profile"></main>
      <main class="view" id="view-room">
        <div class="container">
          <div class="room-hero" id="roomHero"></div>
          <div class="room-layout">
            <div class="room-main">
              <section class="story-intro" id="roomStory"></section>
              <div id="roomMount"></div>
            </div>
            <aside class="room-side" id="roomSide"></aside>
          </div>
        </div>
      </main>
      <footer class="site-footer">🛡️ HackerBot Defense Lab · תוכן הגנתי בלבד — אין מדריכי תקיפה, exploits או payloads</footer>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/rooms-meta.js"></script>
  <script src="js/room1.js"></script>
  <script src="js/room2.js"></script>
  <script src="js/room3.js"></script>
  <script src="js/room4.js"></script>
  <script src="js/room5.js"></script>
  <script src="js/room6.js"></script>
  <script src="js/room7.js"></script>
  <script src="js/room8.js"></script>
  <script src="js/room9.js"></script>
  <script src="js/room10.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
